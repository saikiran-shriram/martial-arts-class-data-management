<!DOCTYPE html>
<html>
<head>
    <title>Coaches</title>
</head>
<body>
    <h1>Coaches</h1>
    <c href="/coaches/add">Add New Coach</c>
    <table border="1">
        <tr>
            <th>ID</th><th>Name</th><th>Age</th><th>Belt</th><th>Experience</th><th>Email</th><th>Action</th>
        </tr>
        {% for c in coaches %}
        <tr>
            <td>{{ c.coach_id }}</td>
            <td>{{ c.coach_name }}</td>
            <td>{{ c.age }}</td>
            <td>{{ c.belt }}</td>
            <td>{{ c.experience }}</td>
            <td>{{ c.email }}</td>
            <td><c href="/coaches/delete/{{ c.coach_id }}">Delete</c></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
