
<!-- Sidebar Toggle Button -->
<button id="sidebarToggle" class="sidebar-toggle" type="button">
    ☰
</button>

<!-- Background Overlay -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<!-- Sidebar -->
<aside id="appSidebar" class="app-sidebar">

    <div class="sidebar-header">
        <h2>🥋 Martial Arts</h2>
        <button id="sidebarClose" type="button">×</button>
    </div>

    <p class="sidebar-subtitle">Management System</p>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/coaches">Coaches</a>
        <a href="/artists">Martial Artists</a>
        <a href="/classes">Classes</a>
        <a href="/styles">Martial Art Styles</a>
        <a href="/tournaments">Tournaments</a>
        <a href="/participations">Participations</a>
        <a href="/attendance">Attendance</a>
    </nav>

</aside>

<!-- Sidebar JavaScript -->
<script>
    const sidebar = document.getElementById('appSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggle = document.getElementById('sidebarToggle');
    const close = document.getElementById('sidebarClose');

    
function openSidebar() {
    sidebar.classList.add('active');
    overlay.classList.add('active');
    document.body.classList.add('sidebar-open');
    sessionStorage.setItem('sidebarOpen', 'true');
}

function closeSidebar() {
    sidebar.classList.remove('active');
    overlay.classList.remove('active');
    document.body.classList.remove('sidebar-open');
    sessionStorage.setItem('sidebarOpen', 'false');
}


    // Restore sidebar state
    if (sessionStorage.getItem('sidebarOpen') === 'true') {
        openSidebar();
    }

    toggle.onclick = () => {
        if (sidebar.classList.contains('active')) {
            closeSidebar();
        } else {
            openSidebar();
        }
    };

    close.onclick = closeSidebar;
    overlay.onclick = closeSidebar;
</script>
