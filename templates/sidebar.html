
<button id="sidebarToggle" class="sidebar-toggle" type="button">
    ☰
</button>

<div id="sidebarOverlay" class="sidebar-overlay"></div>

<aside id="appSidebar" class="app-sidebar">
    <div class="sidebar-header">
        <h2>🥋 Martial Arts</h2>
        <button id="sidebarClose" type="button">×</button>
    </div>

    <p class="sidebar-subtitle">Management System</p>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/coaches">Coaches</a>
        <a href="/artists">Martial Artists</a>
        <a href="/classes">Classes</a>
        <a href="/styles">Martial Art Styles</a>
        <a href="/tournaments">Tournaments</a>
        <a href="/participations">Participations</a>
        <a href="/attendance">Attendance</a>
    </nav>
</aside>

<script>
    const sidebar = document.getElementById('appSidebar');
    const overlay = document.getElementById('sidebarOverlay');

    document.getElementById('sidebarToggle').onclick = () => {
        sidebar.classList.add('active');
        overlay.classList.add('active');
    };

    document.getElementById('sidebarClose').onclick = closeSidebar;
    overlay.onclick = closeSidebar;

    function closeSidebar() {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
    }
</script>
