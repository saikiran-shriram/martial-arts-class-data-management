
<!DOCTYPE html>
<html>
<head>
    <title>Add Class</title>
</head>
<body>
    {% include 'sidebar.html' %}
    <h1>Add New Class</h1>

    <form method="POST">

        Address:
        <input type="text" name="address" required>
        <br><br>

        City:
        <input type="text" name="city" required>
        <br><br>

        State:
        <input type="text" name="state" required>
        <br><br>

        Opening Date:
        <input type="date" name="opening_date" required>
        <br><br>

        Number of Students:
        <input type="number" name="no_of_students" required>
        <br><br>

        Style ID:
        <input type="number" name="style_id" required>
        <br><br>

        Coach ID:
        <input type="number" name="coach_id" required>
        <br><br>

        <button type="submit">Add Class</button>

    </form>

    <br>
    <a href="/classes">Back to Classes</a>

</body>
</html>
