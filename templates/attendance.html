<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
</head>
<body>
    <h1>Attendance</h1>
    <a href="/attendance/add">Add New Attendance</a>
    <table border="1">
        <tr>
            <th>Artist ID</th><th>Class ID</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th>
        </tr>
        {% for a in attendance %}
        <tr>
            <td>{{ a.artist_id }}</td>
            <td>{{ a.class_id }}</td>
            <td>{{ a.date }}</td>
            <td>{{ a.time }}</td>
            <td>{{ a.status }}</td>
            <td>
    <a href="/attendance/edit/{{ a.artist_id }}/{{ a.class_id }}">Edit</a> |
    <a href="/attendance/delete/{{ a.artist_id }}/{{ a.class_id }}">Delete</a>
</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
