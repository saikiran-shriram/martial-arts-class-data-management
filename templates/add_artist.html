<!DOCTYPE html>
<html>
<head>
    <title>Add Artist</title>
</head>
<body>
    <h1>Add New Martial Artist</h1>
    <form method="POST">
        Artist ID: <input type="number" name="artist_id" required><br>
        Name: <input type="text" name="artist_name" required><br>
        Age: <input type="number" name="age"><br>
        Belt: <input type="text" name="belt"><br>
        Mobile: <input type="text" name="mob_no"><br>
        Class ID: <input type="number" name="class_id" required><br>
        Email: <input type="email" name="email"><br>
        <button type="submit">Add</button>
    </form>
</body>
</html>
