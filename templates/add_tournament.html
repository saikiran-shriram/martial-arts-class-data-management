<!DOCTYPE html>
<html>
<head>
    <title>Add Tournament</title>
</head>
<body>
    <h1>Add New Tournament</h1>
    <form method="POST">
        Tournament ID: <input type="number" name=" tournament_id" required><br>
        Date: <input type="text" name="date" required><br>
        Venue: <input type="text" name="venue"><br>
        Level: <input type="text" name="level"><br> 
        <button type="submit">Add</button>
    </form>
</body>
</html>
